name: Build FATXTools

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
    branches: [ master ]
  
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0
        
    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      
    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild FATXTools.sln /t:Restore /p:Configuration=Release
      
    # Build the application
    - name: Build the application
      run: msbuild FATXTools.sln /p:Configuration=Release /p:Platform="Any CPU"
    
    # Execute all unit tests in the solution
    - name: Execute unit tests
      shell: pwsh
      run: |
        dotnet test 2>&1 | Tee-Object -FilePath test.log
        $code = $LASTEXITCODE
        # Show the outcome on the run page.
        "### Unit tests" >> $env:GITHUB_STEP_SUMMARY
        '```' >> $env:GITHUB_STEP_SUMMARY
        Select-String -Path test.log -Pattern 'Passed!|Failed!|\[FAIL\]|error ' | Select-Object -First 60 | ForEach-Object { $_.Line } >> $env:GITHUB_STEP_SUMMARY
        '```' >> $env:GITHUB_STEP_SUMMARY
        Select-String -Path test.log -Pattern '\[FAIL\]' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
        exit $code
      
    # Standalone command line / MCP server
    - name: Publish fatxtools.exe
      run: dotnet publish FATXTools.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/cli

    - name: Upload fatxtools.exe
      uses: actions/upload-artifact@v4
      with:
        name: fatxtools-win-x64
        path: publish/cli/

    # Upload the release build artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FATXTools-Release
        path: FATXTools/bin/Release/
